spring.application.name=DB_Project

# Server
server.port=8081

# DataSource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3307/petdb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA ? (JdbcTemplate? ??)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ?? ??? ??
file.upload-dir=C:/Users/user/Desktop/upload

# ?? ??? ??(??? ?? ??)
spring.web.resources.static-locations=classpath:/static/,file:${file.upload-dir}/

# ??? ??
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# DB schema init (schema.sql, CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

# Session cookie
server.servlet.session.cookie.same-site=lax

# Frontend URL to return to after social login
app.frontend-url=${FRONTEND_URL:http://localhost:5500/index.html}

# Social login (a provider is enabled only when both id and secret are set)
oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
oauth.naver.client-id=${NAVER_CLIENT_ID:}
oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
