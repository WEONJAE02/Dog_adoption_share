spring.application.name=DB_Project

# Server
server.port=8081

# DataSource (MySQL)
# defaults to the local Docker MySQL in README; override with DB_URL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/petdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA ? (JdbcTemplate? ??)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Upload folder (relative to the working directory); override with UPLOAD_DIR
file.upload-dir=${UPLOAD_DIR:uploads}

# ?? ??? ??(??? ?? ??)
spring.web.resources.static-locations=classpath:/static/,file:${file.upload-dir}/

# ??? ??
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# DB schema init (schema.sql, CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

# Session cookie
server.servlet.session.cookie.same-site=lax

# Frontend URL to return to after social login
app.frontend-url=${FRONTEND_URL:http://localhost:5500/index.html}

# Social login (a provider is enabled only when both id and secret are set)
oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
oauth.naver.client-id=${NAVER_CLIENT_ID:}
oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}

# data.go.kr rescued-animal API (key stays on the server; shelter section is disabled when empty)
animal.api.key=${ANIMAL_API_KEY:}
animal.api.base-url=https://apis.data.go.kr/1543061/abandonmentPublicService_v2
