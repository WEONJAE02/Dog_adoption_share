<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>PET ROOM – 반려동물 기록장</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root{
            --bg:#0b0c0f; --panel:#151922; --panel-2:#1b2130; --text:#e6e7eb; --muted:#9aa3b2;
            --brand:#8bc3ff; --chip:#e9eef7; --chip-text:#111; --gap:14px; --radius:18px;
            --line:#222b3a;
        }
        *{box-sizing:border-box}
        body{margin:0; font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; background:var(--bg); color:var(--text)}
        a,button,input,select,textarea{font:inherit}
        .container{max-width:1080px; margin:0 auto; padding:24px 20px}

        .hero{display:grid; grid-template-columns:1.2fr .8fr; align-items:center; gap:24px; padding:28px;
            background:linear-gradient(180deg,#111826 0%,#0f1520 100%); border-radius:24px; border:1px solid var(--line)}
        .title{font-size:44px; line-height:1.15; font-weight:800; letter-spacing:-0.02em; margin:0 0 8px}
        .subtitle{display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 0}
        .pill{padding:8px 12px; border-radius:999px; background:#222a39; color:var(--muted); font-size:13px; border:1px solid #2a3548}
        .actions3{display:flex; gap:14px; margin-top:14px}
        .action{flex:1; background:var(--panel); border:1px solid var(--line); padding:14px; border-radius:18px; display:flex; align-items:center; justify-content:center; color:#dfe6f4; cursor:pointer}
        .action:hover{background:var(--panel-2)}
        .action b{font-size:16px}

        .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:22px 0 6px}
        .tool-input{flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:#111725; border:1px solid #223046; color:var(--text); padding:10px 12px; border-radius:12px}
        .tool-input input{all:unset; flex:1}
        .tool-sel,.tool-btn{background:#111725; border:1px solid #223046; color:var(--text); padding:10px 12px; border-radius:12px}
        .tool-btn{background:#223046; cursor:pointer}
        .tool-btn.primary{background:#2b65ff}

        .filters{display:none !important}

        .grid{display:grid; gap:var(--gap); grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); margin:16px 0 24px}
        .card{background:var(--panel); border:1px solid var(--line); border-radius:20px; overflow:hidden; display:flex; flex-direction:column}
        .thumb{height:170px; width:100%; object-fit:cover; background:#0f1625; cursor:pointer}
        .meta{padding:14px}
        .name{margin:0; font-size:18px; font-weight:700}
        .sub{margin:6px 0 8px; color:var(--muted); font-size:13px}
        .badge{display:inline-block; padding:4px 9px; border-radius:999px; font-size:12px; border:1px solid #2a3548}
        .badge.wait{background:#2a3652; color:#cfe1ff}
        .badge.done{background:#233626; color:#b7f6be}
        .badge.keep{background:#3a2f2f; color:#ffd2d2}
        .foot{display:flex; justify-content:flex-end; gap:8px; padding:12px 14px; border-top:1px solid var(--line)}
        .btn{background:#223046; color:#dbe6ff; border:none; border-radius:10px; padding:8px 10px; cursor:pointer}
        .btn:hover{background:#2a3a56}

        .charts{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0 24px}
        .panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px}
        .panel h5{margin:4px 8px 10px; color:#aab3c3; font-weight:700; font-size:13px}
        canvas{max-height:200px}

        dialog::backdrop{background:rgba(0,0,0,.4)}
        dialog{border:none; border-radius:16px; padding:0; overflow:hidden}

        /* ▶ 등록 모달 가로 넓게(2열) */
        .modal{background:#0f1420; color:#e6ecff; width:min(760px,96vw)}
        .modal header{padding:16px 18px; border-bottom:1px solid var(--line); font-weight:800}
        .modal .body{display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; padding:16px 18px}
        .modal label{display:flex; flex-direction:column; gap:6px; font-size:13px}
        .modal input,.modal textarea,.modal select{background:#0d1320; color:#e6e9f8; border:1px solid #223046; padding:10px 12px; border-radius:10px}
        .modal footer{display:flex; gap:8px; justify-content:flex-end; padding:12px 18px; border-top:1px solid var(--line)}

        /* 메모 + AI 버튼 */
        .label-memo{grid-column:1 / span 2}
        .ai-row{display:flex; gap:8px; align-items:center; margin-top:6px}
        .ai-btn{background:#2b65ff; border:0; color:#fff; border-radius:10px; padding:8px 10px; cursor:pointer}
        .ai-btn[disabled]{opacity:.6; cursor:not-allowed}
        .ai-hint{font-size:12px; color:#9aa3b2}

        .detail{background:#0f1420; color:#e6ecff; width:min(980px,96vw)}
        .detail header{padding:16px 18px; border-bottom:1px solid var(--line); font-weight:800}
        .detail footer{display:flex; gap:8px; justify-content:flex-end; padding:12px 18px; border-top:1px solid var(--line)}
        .d-wrap{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; padding:18px}
        .viewer{position:relative; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#0d1320}
        .viewer img{width:100%; height:360px; object-fit:cover; display:block}
        .nav-btn{position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.45); border:1px solid #3a4760; color:#fff; padding:8px 10px; border-radius:10px; cursor:pointer}
        .nav-prev{left:10px} .nav-next{right:10px}
        .info .row{display:flex; gap:8px; align-items:center; margin:6px 0}
        .info .k{color:#9aa3b2; font-size:13px; width:86px}
        .memo{white-space:pre-wrap}
        .thumbs{margin-top:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:8px}
        .thumbs img{width:100%; height:70px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:pointer; background:#0d1320}

        .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:26px; background:#10182a; border:1px solid #2a3a56; color:#e6ecff; padding:10px 14px; border-radius:10px; font-size:13px; display:none}
        .toast.show{display:block}

        @media (max-width:900px){
            .hero{grid-template-columns:1fr}
            .charts{grid-template-columns:1fr}
            .d-wrap{grid-template-columns:1fr}
            .viewer img{height:300px}
            .modal .body{grid-template-columns:1fr}
            .label-memo{grid-column:1}
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body>
<div class="container">
    <!-- HERO -->
    <section class="hero">
        <div>
            <h1 class="title">PET ROOM<br><span style="color:var(--brand)">Finding a family</span> that suits me</h1>
            <div class="subtitle">
                <span class="pill">check out</span>
                <span class="pill">your pet at a glance</span>
                <span class="pill">adopt</span>
            </div>
            <div class="actions3">
                <a class="action" id="actList"><b>목록 보기</b></a>
                <a class="action" id="actWait"><b>입양대기만</b></a>
                <a class="action" id="actNew"><b>새로 등록</b></a>
            </div>
        </div>
        <img alt="pet" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=1200&auto=format&fit=crop" style="width:100%; border-radius:20px; border:1px solid var(--line);">
    </section>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="tool-input" style="flex:2"><input id="q" placeholder="이름/품종/장소 검색" /></div>
        <select id="status" class="tool-sel">
            <option value="">상태 전체</option>
            <option value="보호중">보호중</option>
            <option value="입양대기">입양대기</option>
            <option value="입양완료">입양완료</option>
        </select>
        <select id="sort" class="tool-sel">
            <option value="latest">최신순</option>
            <option value="name">이름순</option>
            <option value="age">나이 적은순</option>
        </select>
        <button id="btnNew" class="tool-btn primary">등록</button>
    </div>

    <!-- 숨김 안내 배지 -->
    <div class="filters" hidden aria-hidden="true"></div>

    <!-- DASHBOARD -->
    <section class="charts">
        <div class="panel">
            <h5>【 상태별 유기견 현황 】</h5>
            <canvas id="statusChart" height="150"></canvas>
        </div>
        <div class="panel">
            <h5>【 품종별 유기견 현황 】</h5>
            <canvas id="breedChart" height="150"></canvas>
        </div>
    </section>

    <!-- LIST -->
    <ul id="list" class="grid"></ul>
</div>

<!-- EDIT/REGISTER MODAL -->
<dialog id="petDialog">
    <form id="petForm" method="dialog" class="modal">
        <header id="dlgTitle">반려동물 등록</header>
        <div class="body">
            <input type="hidden" id="petId" />
            <label>이름<input id="name" required /></label>
            <label>품종<input id="breed" placeholder="말티즈, 코숏 등" /></label>
            <label>성별
                <select id="gender">
                    <option value="">선택</option>
                    <option>수컷</option><option>암컷</option>
                </select>
            </label>
            <label>구조 장소<input id="found" placeholder="예: 경기도 시흥시" /></label>
            <label>나이(살)<input id="age" type="number" min="0" step="1" /></label>
            <label>상태
                <select id="statusIn">
                    <option>보호중</option>
                    <option>입양대기</option>
                    <option>입양완료</option>
                </select>
            </label>

            <!-- 특징 + AI 버튼 -->
            <label class="label-memo">특징
                <textarea id="memo" rows="5" placeholder="예: 귀엽고 사람을 잘 따르며 사료를 잘 먹어요."></textarea>
                <div class="ai-row">
                    <button type="button" id="aiBtn" class="ai-btn">AI 글쓰기</button>
                    <span class="ai-hint">짧은 키워드를 입력해 두고 누르면 4–5줄 홍보문으로 바꿔 줍니다.</span>
                </div>
            </label>

            <label style="grid-column:1 / span 2">대표 이미지 (1장)
                <input id="photoFile" type="file" accept="image/*" />
            </label>
        </div>
        <footer>
            <button type="button" class="btn" id="btnCancel">취소</button>
            <button id="btnSave" value="default" class="btn">저장</button>
        </footer>
    </form>
</dialog>

<!-- DETAIL MODAL -->
<dialog id="detailDialog" class="detail">
    <header>상세 보기</header>
    <div class="d-wrap">
        <div class="viewer">
            <img id="dMain" alt="main">
            <button class="nav-btn nav-prev" id="dPrev">‹</button>
            <button class="nav-btn nav-next" id="dNext">›</button>
        </div>
        <div class="info">
            <div class="row"><div class="k">이름</div><div id="dName" class="v"></div></div>
            <div class="row"><div class="k">품종</div><div id="dBreed" class="v"></div></div>
            <div class="row"><div class="k">성별</div><div id="dGender" class="v"></div></div>
            <div class="row"><div class="k">구조 장소</div><div id="dFound" class="v"></div></div>
            <div class="row"><div class="k">나이</div><div id="dAge" class="v"></div></div>
            <div class="row"><div class="k">상태</div><div id="dStatus" class="v"></div></div>
            <div class="row"><div class="k">등록일</div><div id="dReg" class="v"></div></div>
            <div class="row" style="align-items:flex-start">
                <div class="k">특징</div>
                <div id="dMemo" class="v memo"></div>
            </div>
            <div class="thumbs" id="dThumbs"></div>
        </div>
    </div>
    <footer>
        <span class="right"></span>
        <button id="dEdit" class="btn">수정</button>
        <button id="dDel" class="btn">삭제</button>
        <button id="dClose" class="btn">닫기</button>
    </footer>
</dialog>

<!-- LIST ITEM TEMPLATE -->
<template id="itemTmpl">
    <li class="card">
        <img class="thumb" alt="사진" />
        <div class="meta">
            <h3 class="name"></h3>
            <div class="sub"></div>
            <span class="badge"></span>
        </div>
        <div class="foot">
            <button class="btn edit">수정</button>
            <button class="btn del">삭제</button>
        </div>
    </li>
</template>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script>
    /* ===== 백엔드 API ===== */
    const API_BASE = 'http://localhost:8081';
    const DOGS = API_BASE + '/dogs';
    const UPLOAD_URL = API_BASE + '/uploads/';

    /* ===== 🔑 데모용 OpenAI 키(로컬 발표만) =====
       👉 아래 문자열에 본인 키를 붙여 넣으세요.
       절대 깃/공유 금지! */
    const OPENAI_API_KEY = '';

    /* ===== 엘리먼트 ===== */
    const $ = (s)=>document.querySelector(s);
    const listEl=$("#list"), qEl=$("#q"), statusSel=$("#status"), sortSel=$("#sort");
    const dlg=$("#petDialog"), form=$("#petForm"), fileEl=$("#photoFile"),
        btnSave=$("#btnSave"), btnCancel=$("#btnCancel"),
        aiBtn=$("#aiBtn"), memoEl=$("#memo");
    const dDlg=$("#detailDialog"), dMain=$("#dMain"), dThumbs=$("#dThumbs");
    const toast=$("#toast");
    let detailTargetId=null, gallery=[], gi=0;

    /* ===== 유틸 ===== */
    const showToast = (msg)=>{ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 1500); };
    const badgeClass = (s)=> s==="입양대기"?"badge wait": s==="입양완료"?"badge done":"badge keep";
    const fmtDate = (iso)=> iso? new Date(iso).toLocaleDateString('ko-KR') : "";
    const getId = (dto)=> dto?.dogId ?? dto?.id;

    const fname = (path)=>{ if(!path) return ''; try{ const p=path.split('?')[0]; const seg=p.split('/'); return seg[segl=seg.length-1]||seg[seg.length-1]; }catch{return '';} };
    const buildUploadUrl = (x)=> !x ? '' : (/^https?:\/\//i.test(x) ? x : (UPLOAD_URL + (x.split('/').pop())));
    const firstImageUrl = (dto)=> Array.isArray(dto?.imageNames) && dto.imageNames[0] ? buildUploadUrl(dto.imageNames[0]) : (dto?.imageUrl?buildUploadUrl(dto.imageUrl):'');
    const imageUrls = (dto)=> Array.isArray(dto?.imageNames)&&dto.imageNames.length? dto.imageNames.map(buildUploadUrl) : (dto?.imageUrl?[buildUploadUrl(dto.imageUrl)]:[]);

    /* ===== 공통 fetch ===== */
    async function req(url, opt={}) {
        const res = await fetch(url, opt);
        if(!res.ok){
            const msg = await res.text().catch(()=>res.statusText);
            throw new Error(msg||('HTTP '+res.status));
        }
        if(res.status===204) return null;
        const ct = res.headers.get('content-type')||'';
        return ct.includes('application/json') ? res.json() : res.text();
    }

    /* ===== API 래퍼 ===== */
    const Dogs = {
        list: (search, status, sort)=> req(`${DOGS}?search=${encodeURIComponent(search||'')}&status=${encodeURIComponent(status||'')}&sort=${encodeURIComponent(sort||'latest')}`),
        get: (id)=> req(`${DOGS}/${id}`),
        stats: ()=> req(`${DOGS}/statistics`),
        create: (payload, file)=>{
            const fd = new FormData();
            fd.append('dog', JSON.stringify(payload));
            if(file) fd.append('image', file);
            return req(DOGS, {method:'POST', body:fd});
        },
        update: (id, payload, file)=>{
            const fd = new FormData();
            fd.append('dog', JSON.stringify(payload));
            if(file) fd.append('image', file);
            return req(`${DOGS}/${id}`, {method:'PUT', body:fd});
        },
        remove: (id)=> req(`${DOGS}/${id}`, {method:'DELETE'})
    };

    /* ===== 리스트 렌더 ===== */
    async function renderList(){
        const rows = await Dogs.list(qEl.value, statusSel.value, sortSel.value);
        listEl.innerHTML = '';
        const t = $("#itemTmpl").content;
        rows.forEach(p=>{
            const n = document.importNode(t,true);
            const img = n.querySelector('.thumb');
            let src = firstImageUrl(p) || 'https://placehold.co/600x400?text=No+Image';
            img.src = src.includes('placehold') ? src : `${src}?v=${Date.now()}`;
            img.alt = p.name||'사진';
            img.onerror = ()=>{ img.src='https://placehold.co/600x400?text=No+Image'; };
            img.addEventListener('click',()=>openDetail(getId(p)));

            n.querySelector('.name').textContent = p.name || '이름없음';
            n.querySelector('.sub').textContent =
                [p.breed, p.foundPlace, (Number.isFinite(p.age)?`${p.age}살`:null)].filter(Boolean).join(' · ');
            const bd = n.querySelector('.badge');
            bd.textContent = p.status || '보호중';
            bd.className = badgeClass(p.status||'보호중');

            n.querySelector('.edit').addEventListener('click',()=>openDialog(p));
            n.querySelector('.del').addEventListener('click',()=>onDelete(getId(p)));
            listEl.appendChild(n);
        });
    }

    /* ===== 상세 ===== */
    function setMain(idx){
        if(!gallery.length){ dMain.src='https://placehold.co/800x600?text=No+Image'; return; }
        gi = (idx+gallery.length)%gallery.length;
        dMain.src = gallery[gi];
    }
    function buildThumbs(){
        dThumbs.innerHTML='';
        gallery.forEach((src,i)=>{
            const im = new Image();
            im.src=src; im.alt='thumb';
            im.style.width='100%'; im.style.height='70px'; im.style.objectFit='cover';
            im.addEventListener('click',()=>setMain(i));
            dThumbs.appendChild(im);
        });
    }
    async function openDetail(id){
        const p = await Dogs.get(id);
        detailTargetId = id;
        gallery = imageUrls(p);
        setMain(0); buildThumbs();

        $("#dName").textContent = p.name || '-';
        $("#dBreed").textContent = p.breed || '-';
        $("#dGender").textContent = p.gender || '-';
        $("#dFound").textContent = p.foundPlace || '-';
        $("#dAge").textContent = Number.isFinite(p.age)?`${p.age}살`:'-';
        $("#dStatus").textContent = p.status || '-';
        $("#dReg").textContent = fmtDate(p.regDate);
        $("#dMemo").textContent = p.memo || '';
        dDlg.showModal();
    }
    $("#dPrev").addEventListener("click",()=>setMain(gi-1));
    $("#dNext").addEventListener("click",()=>setMain(gi+1));
    $("#dClose").addEventListener("click",()=>dDlg.close());
    $("#dEdit").addEventListener("click",async ()=>{
        if(!detailTargetId) return;
        const dto = await Dogs.get(detailTargetId);
        dDlg.close();
        openDialog(dto);
    });
    $("#dDel").addEventListener("click",async ()=>{
        if(!detailTargetId) return;
        if(confirm("정말 삭제할까요?")){
            await Dogs.remove(detailTargetId);
            dDlg.close();
            await renderList(); await loadCharts();
            window.scrollTo(0,0);
            showToast('삭제되었습니다.');
        }
    });

    /* ===== 등록/수정 ===== */
    function openDialog(p){
        form.reset();
        $("#dlgTitle").textContent = p? "반려동물 수정" : "반려동물 등록";
        $("#petId").value = getId(p) ?? '';
        $("#name").value = p?.name ?? '';
        $("#breed").value = p?.breed ?? '';
        $("#gender").value = p?.gender ?? '';
        $("#found").value = p?.foundPlace ?? '';
        $("#age").value = Number.isFinite(p?.age)? p.age : '';
        $("#statusIn").value = p?.status || '보호중';
        $("#memo").value = p?.memo ?? '';
        fileEl.value = '';
        dlg.showModal();
    }
    btnCancel.addEventListener('click', ()=> dlg.close());

    form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const id = $("#petId").value;
        const payload = {
            name: $("#name").value.trim(),
            breed: $("#breed").value.trim(),
            gender: $("#gender").value,
            foundPlace: $("#found").value.trim(),
            age: $("#age").value ? Number($("#age").value) : 0,
            status: $("#statusIn").value,
            memo: $("#memo").value.trim(),
        };
        if(!payload.name){ showToast('이름은 필수입니다.'); return; }

        const file = fileEl.files?.[0];
        btnSave.disabled = true;

        try{
            if(id) await Dogs.update(id, payload, file);
            else   await Dogs.create(payload, file);

            dlg.close();
            await new Promise(r=>setTimeout(r, 30));
            await renderList();
            await loadCharts();
            window.scrollTo(0,0);
            showToast('저장되었습니다.');
        }catch(err){
            alert(err.message || '저장 중 오류가 발생했습니다.');
        }finally{
            btnSave.disabled = false;
        }
    });

    /* ===== 삭제 ===== */
    async function onDelete(id){
        if(!confirm("정말 삭제할까요?")) return;
        await Dogs.remove(id);
        await renderList(); await loadCharts();
        window.scrollTo(0,0);
        showToast('삭제되었습니다.');
    }

    /* ===== 차트 ===== */
    let statusChart, breedChart, chartTimer=null;
    function makeStatusBar(labels, values){
        const ctx = document.getElementById('statusChart');
        if(statusChart) statusChart.destroy();
        statusChart = new Chart(ctx, {
            type:'bar',
            data:{ labels, datasets:[{ label:'유기견 수', data:values }] },
            options:{ responsive:true, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true } } }
        });
    }
    function makeBreedPie(labels, values){
        const ctx = document.getElementById('breedChart');
        if(breedChart) breedChart.destroy();
        breedChart = new Chart(ctx, {
            type:'pie',
            data:{ labels, datasets:[{ data:values }] },
            options:{ responsive:true, plugins:{ legend:{ position:'bottom' } } }
        });
    }
    async function loadCharts(){
        const s = await Dogs.stats();
        const order = ['보호중','입양대기','입양완료'];
        const mapS = new Map((s.statusStats||[]).map(x=>[x.status, x.count]));
        const sLabels = order;
        const sValues = order.map(k=> Number(mapS.get(k)||0));
        makeStatusBar(sLabels, sValues);

        const bLabels = (s.breedStats||[]).map(x=>x.breed);
        const bValues = (s.breedStats||[]).map(x=>Number(x.count||0));
        makeBreedPie(bLabels, bValues);
    }
    function startAutoRefresh(){ clearInterval(chartTimer); chartTimer = setInterval(loadCharts, 5000); }

    /* ===== 🔹 AI 글쓰기(키 하드코딩, 결과로 덮어쓰기) ===== */
    async function aiWrite(){
        if(!OPENAI_API_KEY || OPENAI_API_KEY.startsWith('REPLACE_')){
            alert('OpenAI API Key가 설정되지 않았습니다. 코드 상단 OPENAI_API_KEY에 키를 넣어주세요.');
            return;
        }
        const base = 'https://api.openai.com/v1/chat/completions';
        const memo = memoEl.value.trim() || '귀엽고 사람을 잘 따르고 사료를 잘 먹음';
        const name = $("#name").value.trim() || '아이';
        const breed = $("#breed").value.trim() || '믹스';
        const age = $("#age").value || '';
        const gender = $("#gender").value || '';

        const prompt = `다음 특징을 바탕으로 입양 홍보 문구 4~5줄을 한국어로 작성해줘.
- 이름: ${name}
- 품종: ${breed}
- 나이: ${age?age+'살':'정보없음'}
- 성별: ${gender||'정보없음'}
- 키워드/특징: ${memo}
요구사항: 1) 따뜻하고 믿음 가는 톤, 2) 문장 4~5개, 3) 과장/거짓 금지, 4) 입양 문의를 자연스럽게 유도.`;

        aiBtn.disabled = true; aiBtn.textContent = '작성 중…';
        try{
            const res = await fetch(base, {
                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'Authorization':'Bearer ' + OPENAI_API_KEY
                },
                body: JSON.stringify({
                    model:'gpt-4o-mini',
                    messages:[
                        {role:'system', content:'You are a helpful assistant that writes concise Korean adoption blurbs.'},
                        {role:'user', content: prompt}
                    ],
                    temperature:0.8
                })
            });
            if(!res.ok){ throw new Error(await res.text()); }
            const data = await res.json();
            const text = data.choices?.[0]?.message?.content?.trim() || '';
            memoEl.value = text;                 // ▶ 기존 내용 제거하고 결과만 반영
            showToast('AI 글쓰기가 적용되었습니다.');
        }catch(err){
            alert('AI 글쓰기 실패: '+(err.message||err));
        }finally{
            aiBtn.disabled = false; aiBtn.textContent = 'AI 글쓰기';
        }
    }
    aiBtn?.addEventListener('click', aiWrite);

    /* ===== 초기 구동 ===== */
    document.addEventListener('DOMContentLoaded', async ()=>{
        $("#btnNew").addEventListener("click",()=>openDialog());
        $("#actNew").addEventListener("click",()=>openDialog());
        $("#actWait").addEventListener("click",()=>{ statusSel.value="입양대기"; renderList(); });
        $("#actList").addEventListener("click",()=>{ statusSel.value=""; qEl.value=""; renderList(); });

        qEl.addEventListener("input",renderList);
        statusSel.addEventListener("change",renderList);
        sortSel.addEventListener("change",renderList);

        dlg.addEventListener('close', ()=> form.reset());

        await renderList();
        await loadCharts();
        startAutoRefresh();
    });
</script>
</body>
</html>
