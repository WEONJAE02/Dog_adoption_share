<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>PET ROOM – 반려동물 기록장</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root{
            --bg:#0b0c0f; --panel:#151922; --panel-2:#1b2130; --text:#e6e7eb; --muted:#9aa3b2;
            --brand:#8bc3ff; --chip:#e9eef7; --chip-text:#111; --gap:14px; --radius:18px;
            --line:#222b3a;
        }
        *{box-sizing:border-box}
        body{margin:0; font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; background:var(--bg); color:var(--text)}
        a,button,input,select,textarea{font:inherit}

        .container{max-width:1080px; margin:0 auto; padding:24px 20px}

        /* Hero */
        .hero{display:grid; grid-template-columns:1.2fr .8fr; align-items:center; gap:24px; padding:34px; background:linear-gradient(180deg,#111826 0%,#0f1520 100%); border-radius:28px; border:1px solid var(--line)}
        .title{font-size:56px; line-height:1.05; font-weight:800; letter-spacing:-0.02em; margin:0 0 8px}
        .subtitle{display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 0}
        .pill{padding:8px 12px; border-radius:999px; background:#222a39; color:var(--muted); font-size:13px; border:1px solid #2a3548}

        /* quick actions */
        .actions3{display:flex; gap:18px; margin-top:18px}
        .action{flex:1; background:var(--panel); border:1px solid var(--line); padding:22px; border-radius:26px; display:flex; align-items:center; justify-content:center; color:#dfe6f4}
        .action:hover{background:var(--panel-2)}
        .action b{font-size:18px}

        /* toolbar */
        .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:22px 0 6px}
        .tool-input{flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:#111725; border:1px solid #223046; color:var(--text); padding:10px 12px; border-radius:12px}
        .tool-input input{all:unset; flex:1}
        .tool-sel,.tool-btn{background:#111725; border:1px solid #223046; color:var(--text); padding:10px 12px; border-radius:12px}
        .tool-btn{background:#223046; cursor:pointer}
        .tool-btn.primary{background:#2b65ff}
        .filters{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0}
        .chip{background:var(--chip); color:var(--chip-text); border-radius:999px; padding:6px 10px; font-size:12px}

        /* grid cards */
        .grid{display:grid; gap:var(--gap); grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); margin:16px 0 40px}
        .card{background:var(--panel); border:1px solid var(--line); border-radius:20px; overflow:hidden; display:flex; flex-direction:column}
        .thumb{height:170px; width:100%; object-fit:cover; background:#0f1625; cursor:pointer}
        .meta{padding:14px}
        .name{margin:0; font-size:18px; font-weight:700}
        .sub{margin:6px 0 8px; color:var(--muted); font-size:13px}
        .badge{display:inline-block; padding:4px 9px; border-radius:999px; font-size:12px; border:1px solid #2a3548}
        .badge.wait{background:#2a3652; color:#cfe1ff}
        .badge.done{background:#233626; color:#b7f6be}
        .badge.keep{background:#3a2f2f; color:#ffd2d2}
        .foot{display:flex; justify-content:flex-end; gap:8px; padding:12px 14px; border-top:1px solid var(--line)}
        .btn{background:#223046; color:#dbe6ff; border:none; border-radius:10px; padding:8px 10px; cursor:pointer}
        .btn:hover{background:#2a3a56}

        /* edit dialog (공통) */
        dialog::backdrop{background:rgba(0,0,0,.4)}
        dialog{border:none; border-radius:16px; padding:0; overflow:hidden}
        .modal{background:#0f1420; color:#e6ecff; min-width:360px}
        .modal header{padding:16px 18px; border-bottom:1px solid var(--line); font-weight:800}
        .modal .body{display:flex; flex-direction:column; gap:10px; padding:16px 18px}
        .modal label{display:flex; flex-direction:column; gap:6px; font-size:13px}
        .modal input,.modal textarea,.modal select{background:#0d1320; color:#e6e9f8; border:1px solid #223046; padding:10px 12px; border-radius:10px}
        .modal footer{display:flex; gap:8px; justify-content:flex-end; padding:12px 18px; border-top:1px solid var(--line)}

        /* detail dialog (큰 사이즈 + 갤러리) */
        .detail{background:#0f1420; color:#e6ecff; width:min(980px,96vw)}
        .detail header{padding:16px 18px; border-bottom:1px solid var(--line); font-weight:800}
        .detail footer{display:flex; gap:8px; justify-content:flex-end; padding:12px 18px; border-top:1px solid var(--line)}
        .d-wrap{display:grid; grid-template-columns:1.25fr 1fr; gap:18px; padding:18px}
        .viewer{position:relative; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#0d1320}
        .viewer img{width:100%; height:380px; object-fit:cover; display:block}
        .nav-btn{position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.45); border:1px solid #3a4760; color:#fff; padding:8px 10px; border-radius:10px; cursor:pointer}
        .nav-btn:hover{background:rgba(0,0,0,.6)}
        .nav-prev{left:10px} .nav-next{right:10px}

        .info .row{display:flex; gap:8px; align-items:center; margin:6px 0}
        .info .k{color:#9aa3b2; font-size:13px; width:86px}
        .info .v{font-size:15px}
        .memo{white-space:pre-wrap}

        /* masonry thumbs */
        .thumbs{margin-top:12px; columns:3 120px; column-gap:10px}
        .thumbs img{width:100%; margin:0 0 10px; border-radius:8px; border:1px solid var(--line); cursor:pointer; display:block; background:#0d1320; object-fit:cover}
        .right{margin-left:auto}

        @media (max-width:900px){
            .hero{grid-template-columns:1fr}
            .d-wrap{grid-template-columns:1fr}
            .viewer img{height:320px}
            .thumbs{columns:3 100px}
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HERO -->
    <section class="hero">
        <div>
            <h1 class="title">PET ROOM<br><span style="color:var(--brand)">Finding a family</span> that suits me</h1>
            <div class="subtitle">
                <span class="pill">check out</span>
                <span class="pill">your pet at a glance</span>
                <span class="pill">adopt</span>
            </div>
            <div class="actions3">
                <a class="action" id="actList"><b>목록 보기</b></a>
                <a class="action" id="actWait"><b>입양대기만</b></a>
                <a class="action" id="actNew"><b>새로 등록</b></a>
            </div>
        </div>
        <img alt="pet" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=1200&auto=format&fit=crop" style="width:100%; border-radius:20px; border:1px solid var(--line);">
    </section>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="tool-input" style="flex:2"><input id="q" placeholder="이름/품종/장소 검색" /></div>
        <select id="status" class="tool-sel">
            <option value="">상태 전체</option>
            <option value="보호중">보호중</option>
            <option value="입양대기">입양대기</option>
            <option value="입양완료">입양완료</option>
        </select>
        <select id="sort" class="tool-sel">
            <option value="reg_date,desc">최신순</option>
            <option value="name,asc">이름순</option>
            <option value="age,asc">나이 적은순</option>
        </select>
        <button id="btnNew" class="tool-btn primary">등록</button>
    </div>
    <div class="filters">
        <span class="chip">단일 테이블: pet</span>
        <span class="chip">필드: name / breed / found_place / age / status / memo / image_urls[] / reg_date</span>
    </div>

    <!-- GRID -->
    <ul id="list" class="grid"></ul>
</div>

<!-- EDIT/REGISTER MODAL -->
<dialog id="petDialog">
    <form id="petForm" method="dialog" class="modal">
        <header id="dlgTitle">반려동물 등록</header>
        <div class="body">
            <input type="hidden" id="petId" />
            <label>이름<input id="name" required /></label>
            <label>품종<input id="breed" placeholder="말티즈, 코숏 등" /></label>
            <label>구조 장소<input id="found" placeholder="예: 강남구 개포동" /></label>
            <label>나이(살)<input id="age" type="number" min="0" step="1" /></label>
            <label>상태
                <select id="statusIn">
                    <option>보호중</option>
                    <option>입양대기</option>
                    <option>입양완료</option>
                </select>
            </label>
            <label>특징<textarea id="memo" rows="3"></textarea></label>

            <label>사진 URL들 (여러 줄/쉼표로 구분)
                <textarea id="photoUrls" rows="3" placeholder="각 줄에 한 개씩 입력하거나, 쉼표로 구분해 입력"></textarea>
            </label>
            <label>사진 파일 선택 (여러 장)
                <input id="photoFiles" type="file" accept="image/*" multiple />
            </label>
        </div>
        <footer>
            <button value="cancel" class="btn">취소</button>
            <button id="btnSave" value="default" class="btn">저장</button>
        </footer>
    </form>
</dialog>

<!-- DETAIL MODAL -->
<dialog id="detailDialog" class="detail">
    <header>상세 보기</header>
    <div class="d-wrap">
        <div class="viewer">
            <img id="dMain" alt="main">
            <button class="nav-btn nav-prev" id="dPrev">‹</button>
            <button class="nav-btn nav-next" id="dNext">›</button>
        </div>
        <div class="info">
            <div class="row"><div class="k">이름</div><div id="dName" class="v"></div></div>
            <div class="row"><div class="k">품종</div><div id="dBreed" class="v"></div></div>
            <div class="row"><div class="k">구조 장소</div><div id="dFound" class="v"></div></div>
            <div class="row"><div class="k">나이</div><div id="dAge" class="v"></div></div>
            <div class="row"><div class="k">상태</div><div id="dStatus" class="v"></div></div>
            <div class="row"><div class="k">등록일</div><div id="dReg" class="v"></div></div>
            <div class="row" style="align-items:flex-start">
                <div class="k">특징</div>
                <div id="dMemo" class="v memo"></div>
            </div>
            <div class="thumbs" id="dThumbs"></div>
        </div>
    </div>
    <footer>
        <span class="right"></span>
        <button id="dEdit" class="btn">수정</button>
        <button id="dDel" class="btn">삭제</button>
        <button id="dClose" class="btn">닫기</button>
    </footer>
</dialog>

<!-- TEMPLATE -->
<template id="itemTmpl">
    <li class="card">
        <img class="thumb" alt="사진" />
        <div class="meta">
            <h3 class="name"></h3>
            <div class="sub"></div>
            <span class="badge"></span>
        </div>
        <div class="foot">
            <button class="btn edit">수정</button>
            <button class="btn del">삭제</button>
        </div>
    </li>
</template>

<script>
    /* ============== 데이터 ============== */
    const KEY="pet_single_v1";
    const load=()=>JSON.parse(localStorage.getItem(KEY)||"[]");
    const save=(v)=>localStorage.setItem(KEY,JSON.stringify(v));

    // 최초 샘플 (image_urls 배열 사용)
    (function seed(){
        if(!localStorage.getItem(KEY)){
            const now=new Date().toISOString();
            const s=[
                {id:"p1",name:"콩이",breed:"코리안숏헤어",found_place:"성동구",age:3,status:"입양대기",memo:"순둥이",
                    image_urls:[
                        "https://images.unsplash.com/photo-1574158622682-e40e69881006?q=80&w=1200&auto=format&fit=crop",
                        "https://images.unsplash.com/photo-1543852786-1cf6624b9987?q=80&w=1200&auto=format&fit=crop"
                    ],reg_date:now,updated_at:now},
                {id:"p2",name:"보리",breed:"말티즈",found_place:"용산구",age:4,status:"보호중",memo:"산책 좋아함",
                    image_urls:[
                        "https://images.unsplash.com/photo-1552053831-71594a27632d?q=80&w=1200&auto=format&fit=crop",
                        "https://images.unsplash.com/photo-1568572933382-74d440642117?q=80&w=1200&auto=format&fit=crop",
                        "https://images.unsplash.com/photo-1504595403659-9088ce801e29?q=80&w=1200&auto=format&fit=crop"
                    ],reg_date:now,updated_at:now},
                {id:"p3",name:"해피",breed:"믹스",found_place:"수원",age:2,status:"입양완료",memo:"사람 좋아함",
                    image_urls:[
                        "https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=1200&auto=format&fit=crop"
                    ],reg_date:now,updated_at:now}
            ];
            save(s);
        }
    })();

    /* ============== 상태/요소 ============== */
    const $=s=>document.querySelector(s);
    const listEl=$("#list"), qEl=$("#q"), statusSel=$("#status"), sortSel=$("#sort");
    const dlg=$("#petDialog"), form=$("#petForm");
    const filesEl=$("#photoFiles"), urlsEl=$("#photoUrls");
    const dDlg=$("#detailDialog"), dMain=$("#dMain"), dThumbs=$("#dThumbs");
    let data=load();

    // 상세 갤러리 상태
    let detailTargetId=null;
    let gallery=[], gi=0;
    const firstImage = (p)=> (p.image_urls?.[0] || p.image_url || "");

    /* ============== 유틸 ============== */
    const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const readAsDataURL = (file)=>new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);});
    const badgeClass = (s)=> s==="입양대기"?"badge wait": s==="입양완료"?"badge done":"badge keep";
    const formatDate = (iso)=> iso? new Date(iso).toLocaleDateString('ko-KR') : "";

    /* ============== 렌더 ============== */
    function render(){
        const q=qEl.value.trim().toLowerCase();
        const st=statusSel.value;

        let rows=data.filter(r=>{
            const hit=(r.name||"").toLowerCase().includes(q)
                || (r.breed||"").toLowerCase().includes(q)
                || (r.found_place||"").toLowerCase().includes(q);
            return (!q || hit) && (!st || r.status===st);
        });

        const [field,dir]=sortSel.value.split(",");
        rows.sort((a,b)=>{
            if(field==="age") return ((a.age||0)-(b.age||0))*(dir==="asc"?1:-1);
            if(field==="reg_date") return (new Date(a.reg_date)-new Date(b.reg_date))*(dir==="asc"?1:-1);
            return (""+(a[field]||"")).localeCompare(""+(b[field]||""))*(dir==="asc"?1:-1);
        });

        listEl.innerHTML="";
        const t=$("#itemTmpl").content;
        rows.forEach(p=>{
            const n=document.importNode(t,true);
            const img=n.querySelector(".thumb");
            img.src = firstImage(p) || "https://placehold.co/600x400?text=No+Image";
            img.alt = p.name || "사진";
            img.addEventListener("click",()=>openDetail(p));

            n.querySelector(".name").textContent = p.name || "이름없음";
            n.querySelector(".sub").textContent = [p.breed, p.found_place, (p.age!=null?`${p.age}살`:null)].filter(Boolean).join(" · ");
            const bd=n.querySelector(".badge"); bd.textContent=p.status||"보호중"; bd.className=badgeClass(p.status||"보호중");

            n.querySelector(".edit").addEventListener("click",()=>openDialog(p));
            n.querySelector(".del").addEventListener("click",()=>onDelete(p.id));
            listEl.appendChild(n);
        });
    }

    /* ============== 상세 보기(갤러리) ============== */
    function setMain(idx){
        if(!gallery.length) { dMain.src="https://placehold.co/800x600?text=No+Image"; return; }
        gi = (idx+gallery.length)%gallery.length;
        dMain.src = gallery[gi];
    }
    function buildThumbs(){
        dThumbs.innerHTML="";
        gallery.forEach((src,idx)=>{
            const im=new Image();
            im.src=src; im.alt="thumb";
            im.style.height="100%";
            im.addEventListener("click",()=>setMain(idx));
            dThumbs.appendChild(im);
        });
    }
    function openDetail(p){
        detailTargetId=p.id;
        gallery=(p.image_urls && p.image_urls.length? p.image_urls : (p.image_url? [p.image_url]:[]));
        setMain(0); buildThumbs();

        $("#dName").textContent  = p.name || "-";
        $("#dBreed").textContent = p.breed || "-";
        $("#dFound").textContent = p.found_place || "-";
        $("#dAge").textContent   = (p.age!=null?`${p.age}살`:"-");
        $("#dStatus").textContent= p.status || "-";
        $("#dReg").textContent   = formatDate(p.reg_date);
        $("#dMemo").textContent  = p.memo || "";

        dDlg.showModal();
    }
    $("#dPrev").addEventListener("click",()=>setMain(gi-1));
    $("#dNext").addEventListener("click",()=>setMain(gi+1));
    $("#dClose").addEventListener("click",()=>dDlg.close());
    $("#dEdit").addEventListener("click",()=>{
        const p=data.find(x=>x.id===detailTargetId);
        if(p){ dDlg.close(); openDialog(p); }
    });
    $("#dDel").addEventListener("click",()=>{
        if(!detailTargetId) return;
        if(confirm("정말 삭제할까요?")){
            data=data.filter(x=>x.id!==detailTargetId); save(data); dDlg.close(); render();
        }
    });

    /* ============== 등록/수정 모달 ============== */
    function openDialog(p){
        form.reset();
        $("#dlgTitle").textContent = p?"반려동물 수정":"반려동물 등록";
        $("#petId").value = p?.id || "";
        $("#name").value = p?.name || "";
        $("#breed").value = p?.breed || "";
        $("#found").value = p?.found_place || "";
        $("#age").value = p?.age ?? "";
        $("#statusIn").value = p?.status || "보호중";
        $("#memo").value = p?.memo || "";

        // URL textarea: 기존 배열 → 줄바꿈
        const urls = (p?.image_urls && p.image_urls.length? p.image_urls
            : (p?.image_url? [p.image_url]:[]));
        urlsEl.value = urls.join("\n");
        filesEl.value = "";
        dlg.showModal();
    }

    async function onSave(e){
        e.preventDefault();
        const id = $("#petId").value || uid();
        if(!$("#name").value.trim()){ alert("이름은 필수입니다."); return; }

        // URL들 파싱(줄바꿈/쉼표)
        const urlsParsed = urlsEl.value
            .split(/[\n,]/g).map(s=>s.trim()).filter(Boolean);

        // 파일들 → dataURL 배열
        const files = Array.from(filesEl.files||[]);
        const fileUrls = await Promise.all(files.map(readAsDataURL));

        const images = [...urlsParsed, ...fileUrls];

        const payload = {
            id,
            name: $("#name").value.trim(),
            breed: $("#breed").value.trim(),
            found_place: $("#found").value.trim(),
            age: $("#age").value ? Number($("#age").value) : null,
            status: $("#statusIn").value,
            memo: $("#memo").value.trim(),
            image_urls: images
        };

        const i = data.findIndex(x=>x.id===id);
        if(i>=0) data[i] = {...data[i], ...payload, updated_at:new Date().toISOString()};
        else data.push({...payload, reg_date:new Date().toISOString(), updated_at:new Date().toISOString()});

        save(data); dlg.close(); render();
    }

    function onDelete(id){
        if(!confirm("정말 삭제할까요?")) return;
        data = data.filter(x=>x.id!==id); save(data); render();
    }

    /* ============== 이벤트 바인딩 ============== */
    document.addEventListener("DOMContentLoaded",()=>{
        $("#btnNew").addEventListener("click",()=>openDialog());
        $("#actNew").addEventListener("click",()=>openDialog());
        $("#actWait").addEventListener("click",()=>{ statusSel.value="입양대기"; render(); });
        $("#actList").addEventListener("click",()=>{ statusSel.value=""; qEl.value=""; render(); });

        qEl.addEventListener("input",render);
        statusSel.addEventListener("change",render);
        sortSel.addEventListener("change",render);
        form.addEventListener("submit",onSave);

        render();
    });
</script>
</body>
</html>
